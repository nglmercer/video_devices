[package]
name = "rust_video_devices"
version = "0.1.0"
edition = "2021"
description = "Sistema simplificado de cámaras usando Nokhwa"

# Optimizaciones de rendimiento para release
[profile.release]
lto = true              # Link Time Optimization
codegen-units = 1       # Mejor optimización
panic = "abort"         # Reduce tamaño binario
strip = true            # Elimina símbolos de depuración
opt-level = 3           # Máxima optimización

[profile.dev]
opt-level = 1           # Optimizaciones básicas en debug
debug = true

[dependencies]
# Core dependencies
anyhow = "1.0"

# Slint for UI (using stable version)
slint = "1.14"

# Nokhwa para manejo de cámaras (única dependencia principal)
nokhwa = { version = "0.10", features = ["input-native"] }

# Image processing for camera frames
image = "0.24"
imageproc = "0.23"

# Performance optimizations
rayon = "1.8"
tokio = { version = "1.0", features = ["full"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"

# SIMD optimizations
wide = "0.7"

# Buffer pooling
lazy_static = "1.4"

# Dependencies específicas para Windows
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Media_MediaFoundation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "rust_video_devices"
path = "src/main.rs"

# Script de compilación optimizado
build = "build_optimized.rs"

[build-dependencies]
slint-build = "1.14"
